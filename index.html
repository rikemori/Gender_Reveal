<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gender Reveal App - 改良版</title>
  <!-- フォントとアイコン -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- 紙吹雪用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* 全体のスタイル */
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, #ffe6ea 0%, #e8f4fe 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem 1.8rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(5px);
      position: relative;
    }

    /* 開発者モード用UI */
    .dev-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dev-icon {
      color: #ccc;
      font-size: 1.1rem;
      transition: color 0.3s;
    }
    
    .dev-icon.active {
      color: #7b68ee;
    }

    /* Dev Mode トグルスイッチ */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #eee;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #7b68ee; }
    input:checked + .slider:before { transform: translateX(16px); }

    h1 {
      font-size: 1.6rem;
      color: #444;
      margin-bottom: 0.3rem;
      margin-top: 10px;
    }

    p.subtitle {
      color: #777;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* 予定日カウントダウンエリア */
    .due-date-box {
      background: #ffffff;
      border: 2px dashed #ff9a9e;
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .due-date-title {
      font-size: 0.85rem;
      color: #888;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }

    .due-date-text {
      font-size: 0.95rem;
      color: #ff6b81;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .timer-display {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .timer-unit {
      background: #fff0f3;
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 45px;
    }

    .timer-num {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d81b60;
      line-height: 1.1;
    }

    .timer-label {
      font-size: 0.65rem;
      color: #888;
    }

    /* Boy / Girl 画像並列エリア */
    .question-images-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.2rem;
    }

    .question-img {
      width: 48%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    /* 発表ボタン */
    .reveal-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff819c, #64b5f6);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .reveal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    /* 演出・結果表示エリア */
    .result-area {
      margin-top: 1.5rem;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ドラムロールカウントダウン表示 */
    .countdown {
      font-size: 3rem;
      font-weight: bold;
      color: #555;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* 結果全体コンテナ */
    .result-box {
      display: none;
      width: 100%;
      animation: popIn 0.5s ease-out forwards;
      box-sizing: border-box;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 性別発表メイン（ピンクグラデーションエリア） */
    .gender-card {
      width: 100%;
      padding: 1.5rem 1rem 1.2rem 1rem;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      box-shadow: 0 4px 12px rgba(255, 154, 158, 0.3);
      box-sizing: border-box;
      margin-bottom: 1rem;
    }

    .result-title {
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
    }

    .result-gender {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 0.8rem;
    }

    /* 結果表示内の女の子画像 */
    .result-girl-img {
      width: 65%;
      max-width: 220px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
      margin: 0 auto;
      display: block;
      background: #fff;
    }

    /* エコーギャラリー用の薄水色エリア */
    .echo-gallery-box {
      background: linear-gradient(135deg, #e6f3ff 0%, #dbeafe 100%);
      border-radius: 16px;
      padding: 1rem 0.8rem 0.8rem 0.8rem;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.03), 0 4px 12px rgba(0, 0, 0, 0.06);
    }

    .swipe-notice {
      font-size: 0.9rem;
      font-weight: bold;
      color: #2b6cb0;
      margin-bottom: 0.6rem;
    }

    /* スワイプギャラリー部分 */
    .slider-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      touch-action: pan-y;
      background: #fff;
      aspect-ratio: 4 / 3;
    }

    .slider-wrapper {
      display: flex;
      transition: transform 0.3s ease-out;
      width: 100%;
      height: 100%;
    }

    .slide-item {
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      position: relative;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 0;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      width: 100%;
      text-align: center;
    }

    /* 開発者モード時の画像操作操作ボタン */
    .slide-actions {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    .action-btn.delete:hover {
      background: #e53e3e;
    }

    /* 左右矢印ボタン */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: none;
      color: #333;
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s;
    }

    .nav-btn:hover { background: rgba(255, 255, 255, 1); }
    .prev-btn { left: 8px; }
    .next-btn { right: 8px; }

    .page-counter {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #3b82f6;
      font-weight: bold;
    }

    /* 開発者モードパネル */
    .dev-panel {
      display: none;
      background: #fff;
      border: 2px dashed #7b68ee;
      border-radius: 16px;
      padding: 1.2rem 1rem;
      margin-top: 1.5rem;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
      animation: slideDown 0.3s ease-out forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dev-panel-title {
      font-size: 1rem;
      font-weight: 800;
      color: #7b68ee;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .upload-area {
      border: 2px dashed #e0e0e0;
      background: #fafafa;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      position: relative;
      margin-bottom: 10px;
    }

    .upload-area:hover {
      border-color: #7b68ee;
      background: #f5f3ff;
    }

    .upload-icon {
      font-size: 1.5rem;
      color: #ccc;
      margin-bottom: 4px;
    }

    .upload-text {
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
    }

    #fileInput { display: none; }

    .input-label {
      font-size: 0.8rem;
      color: #555;
      text-align: left;
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    .date-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
    }
    
    .date-input:focus { border-color: #7b68ee; }

    .btn-add {
      background-color: #7b68ee;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 開発者モードスイッチ -->
    <div class="dev-controls">
      <i class="fa-solid fa-key dev-icon" id="devIcon"></i>
      <label class="switch">
        <input type="checkbox" id="devModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <h1>Gender Reveal 👶✨</h1>
    <p class="subtitle">赤ちゃんの性別はどっち...？</p>

    <!-- 出産予定日までのカウントダウン枠 -->
    <div class="due-date-box">
      <div class="due-date-title">BABY DUE DATE 🍼</div>
      <div class="due-date-text">2026.12.18. まで</div>
      <div class="timer-display">
        <div class="timer-unit"><div id="days" class="timer-num">00</div><div class="timer-label">日</div></div>
        <div class="timer-unit"><div id="hours" class="timer-num">00</div><div class="timer-label">時間</div></div>
        <div class="timer-unit"><div id="minutes" class="timer-num">00</div><div class="timer-label">分</div></div>
        <div class="timer-unit"><div id="seconds" class="timer-num">00</div><div class="timer-label">秒</div></div>
      </div>
    </div>

    <!-- 発表前エリア -->
    <div id="beforeRevealArea">
      <div class="question-images-box">
        <img class="question-img" src="baby_boy09_question.png" alt="Boy Question">
        <img class="question-img" src="baby_girl09_question.png" alt="Girl Question">
      </div>
      <button id="revealBtn" class="reveal-btn" onclick="startReveal()">性別を知る 🎁</button>
    </div>

    <!-- 結果表示エリア -->
    <div class="result-area">
      <div id="countdown" class="countdown" style="display: none;"></div>
      
      <div id="resultBox" class="result-box">
        
        <!-- ① 性別発表 -->
        <div class="gender-card">
          <div class="result-title">Baby is a...</div>
          <div class="result-gender">GIRL ! 💗</div>
          <img class="result-girl-img" src="baby_girl10_heart.png" alt="Girl Result">
        </div>

        <!-- ② エコー写真 -->
        <div class="echo-gallery-box">
          <div class="swipe-notice">👈 エコー写真をみるにはスワイプ 👉</div>
          
          <div class="slider-container" id="sliderContainer">
            <button class="nav-btn prev-btn" onclick="prevSlide()">❮</button>
            <div class="slider-wrapper" id="sliderWrapper"></div>
            <button class="nav-btn next-btn" onclick="nextSlide()">❯</button>
          </div>
          <div class="page-counter" id="pageCounter"></div>
        </div>

        <!-- 開発者モードパネル -->
        <div class="dev-panel" id="devPanel">
          <div class="dev-panel-title">
            <i class="fa-solid fa-code"></i> 次回エコー写真の追加
          </div>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*">
            <i class="fa-solid fa-camera upload-icon"></i>
            <div class="upload-text">スマホで撮影またはアルバムから</div>
          </div>
          <label class="input-label" for="dateInput">検診日（日付）</label>
          <input type="date" id="dateInput" class="date-input">
          <button class="btn-add" id="addBtn">アルバムに追加</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const DEV_PASSWORD = "baby1218";
    const STORAGE_KEY_ECHOES = "baby_app_echoes";

    // 妊娠0週0日の日付 (2026/12/18出産予定日から算出した2026/03/13)
    const START_PREGNANCY_DATE = new Date('2026-03-13T00:00:00');

    // 初期エコー写真リスト
    const initialEchoes = [
      { url: "echo_01.png", caption: "2026.04.24.（6w0d）" },
      { url: "echo_02.png", caption: "2026.05.11.（8w3d）" },
      { url: "echo_03.png", caption: "2026.05.18.（9w3d）" },
      { url: "echo_04.png", caption: "2026.05.21.（9w6d）" },
      { url: "echo_05.png", caption: "2026.06.04.（11w6d）" },
      { url: "echo_06_1.png", caption: "2026.07.03.（16w0d）" },
      { url: "echo_06_2.png", caption: "2026.07.03.（16w0d）" },
      { url: "echo_07.png", caption: "2026.07.14.（17w4d）" },
      { url: "echo_08_1.png", caption: "2026.08.03.（20w3d）" },
      { url: "echo_08_2.png", caption: "2026.08.03.（20w3d）" },
      { url: "echo_08_3.png", caption: "2026.08.03.（20w3d）" },
      { url: "echo_08_4.png", caption: "2026.08.03.（20w3d）" },
      { url: "echo_09.png", caption: "2026.08.06.（20w6d）" },
      { url: "echo_10_1.png", caption: "2026.09.02.（24w5d）" },
      { url: "echo_10_2.png", caption: "2026.09.02.（24w5d）" },
      { url: "echo_10_3.png", caption: "2026.09.02.（24w5d）" },
      { url: "echo_10_4.png", caption: "2026.09.02.（24w5d）" },
      { url: "echo_11_1.png", caption: "2026.09.16.（26w5d）" },
      { url: "echo_11_2.png", caption: "2026.09.16.（26w5d）" }
    ];

    let echoes = JSON.parse(localStorage.getItem(STORAGE_KEY_ECHOES)) || initialEchoes;
    let currentIndex = 0;
    let isDevUnlocked = false;

    // 日付から「YYYY.MM.DD.（XwYd）」の形式を算出する関数
    function formatCaptionFromDate(dateString) {
      if (!dateString) return "";
      const selectedDate = new Date(dateString + 'T00:00:00');
      
      const diffTime = selectedDate.getTime() - START_PREGNANCY_DATE.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;

      const yyyy = selectedDate.getFullYear();
      const mm = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const dd = String(selectedDate.getDate()).padStart(2, '0');

      return `${yyyy}.${mm}.${dd}.（${weeks}w${days}d）`;
    }

    // 予定日のリアルタイムカウントダウン (2026/12/18)
    const targetDate = new Date('2026-12-18T00:00:00').getTime();

    function updateDueDateTimer() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector('.due-date-box').innerHTML = "<div class='due-date-text'>出産予定日を迎えました！👶✨</div>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateDueDateTimer, 1000);
    updateDueDateTimer();

    // 紙吹雪機能
    function launchConfetti() {
      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti({
          ...defaults,
          ...opts,
          particleCount: Math.floor(count * particleRatio)
        });
      }

      fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff9a9e', '#fecfef', '#ffffff'] });
      fire(0.2, { spread: 60, colors: ['#ff819c', '#ffd1dc', '#ffd700'] });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#ff819c', '#ffffff'] });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    // エコー写真スライダーの初期化と制御
    const sliderWrapper = document.getElementById('sliderWrapper');
    const pageCounter = document.getElementById('pageCounter');

    function renderSlider() {
      sliderWrapper.innerHTML = '';
      echoes.forEach((echo, index) => {
        const slide = document.createElement('div');
        slide.className = 'slide-item';
        
        // 開発者モード用の編集・削除ボタンを追加
        let devButtonsHtml = '';
        if (isDevUnlocked) {
          devButtonsHtml = `
            <div class="slide-actions">
              <button class="action-btn" onclick="editCaption(${index})" title="キャプション編集"><i class="fa-solid fa-pen"></i></button>
              <button class="action-btn delete" onclick="deleteSlide(${index})" title="削除"><i class="fa-solid fa-trash"></i></button>
            </div>
          `;
        }

        slide.innerHTML = `
          ${devButtonsHtml}
          <img class="slide-img" src="${echo.url}" alt="echo ${index + 1}">
          <div class="slide-caption">${echo.caption}</div>
        `;
        sliderWrapper.appendChild(slide);
      });
      updateSlider(true);
    }

    function updateSlider(immediate = false) {
      if (echoes.length === 0) {
        sliderWrapper.innerHTML = '<div class="slide-item"><div class="slide-caption">写真は登録されていません</div></div>';
        pageCounter.textContent = '0 / 0';
        return;
      }
      if (immediate) sliderWrapper.style.transition = 'none';
      sliderWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
      pageCounter.textContent = `${currentIndex + 1} / ${echoes.length}`;
      if (immediate) setTimeout(() => sliderWrapper.style.transition = 'transform 0.3s ease-out', 50);
    }

    function nextSlide() {
      if (echoes.length === 0) return;
      currentIndex = (currentIndex + 1) % echoes.length;
      updateSlider();
    }

    function prevSlide() {
      if (echoes.length === 0) return;
      currentIndex = (currentIndex - 1 + echoes.length) % echoes.length;
      updateSlider();
    }

    // 編集機能
    function editCaption(index) {
      const currentCaption = echoes[index].caption;
      const newCaption = prompt("表示テキストを入力してください:", currentCaption);
      if (newCaption !== null && newCaption.trim() !== "") {
        echoes[index].caption = newCaption.trim();
        saveEchoes();
        renderSlider();
      }
    }

    // 削除機能
    function deleteSlide(index) {
      if (confirm("この写真を削除しますか？")) {
        echoes.splice(index, 1);
        if (currentIndex >= echoes.length) {
          currentIndex = Math.max(0, echoes.length - 1);
        }
        saveEchoes();
        renderSlider();
      }
    }

    function saveEchoes() {
      try {
        localStorage.setItem(STORAGE_KEY_ECHOES, JSON.stringify(echoes));
      } catch(e) {
        alert("保存時にエラーが発生しました。");
      }
    }

    // タッチスワイプ
    let startX = 0;
    const container = document.getElementById('sliderContainer');
    container.addEventListener('touchstart', (e) => startX = e.touches[0].clientX, {passive: true});
    container.addEventListener('touchend', (e) => {
      const diffX = startX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 40) {
        if (diffX > 0) nextSlide();
        else prevSlide();
      }
    }, {passive: true});

    // 性別発表ボタンの動作
    function startReveal() {
      document.getElementById('beforeRevealArea').style.display = 'none';
      const countdownEl = document.getElementById('countdown');
      countdownEl.style.display = 'block';
      let count = 3;
      countdownEl.textContent = 'ドキドキ...';

      const timer = setInterval(() => {
        if (count > 0) {
          countdownEl.textContent = count;
          count--;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          document.getElementById('resultBox').style.display = 'block';
          renderSlider();
          launchConfetti();
        }
      }, 800);
    }

    // 開発者モード用スクリプト
    const devModeToggle = document.getElementById('devModeToggle');
    const devIcon = document.getElementById('devIcon');
    const devPanel = document.getElementById('devPanel');
    const fileInput = document.getElementById('fileInput');
    const dateInput = document.getElementById('dateInput');
    const addBtn = document.getElementById('addBtn');
    let tempImageData = null;

    // 今日の日付を初期値としてセット
    const todayStr = new Date().toISOString().split('T')[0];
    dateInput.value = todayStr;

    devModeToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        const pass = prompt("開発者パスワードを入力してください");
        if (pass === DEV_PASSWORD) {
          isDevUnlocked = true;
          devPanel.style.display = 'block';
          devIcon.classList.add('active');
          renderSlider(); // 編集・削除ボタンを表示するために再描写
        } else {
          alert("パスワードが違います");
          e.target.checked = false;
        }
      } else {
        isDevUnlocked = false;
        devPanel.style.display = 'none';
        devIcon.classList.remove('active');
        renderSlider();
      }
    });

    // アップロードエリアのクリック
    document.getElementById('uploadArea').addEventListener('click', () => fileInput.click());

    // ファイル選択時の処理 (圧縮して読み込み)
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          // 画像の圧縮とリサイズ (長辺1000px制限、JPEG品質0.7)
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const maxDim = 1000;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          tempImageData = canvas.toDataURL('image/jpeg', 0.7);
          alert("写真を読み込みました。日付を確認して追加してください。");
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // アルバムに追加ボタン
    addBtn.addEventListener('click', () => {
      if (!tempImageData) return alert("まずは写真を撮影または選択してください。");
      if (!dateInput.value) return alert("日付を選択してください。");

      const captionText = formatCaptionFromDate(dateInput.value);

      echoes.push({
        url: tempImageData,
        caption: captionText
      });

      try {
        saveEchoes();
        renderSlider();
        currentIndex = echoes.length - 1;
        updateSlider();
        tempImageData = null;
        fileInput.value = '';
        alert("写真をアルバムに追加しました！");
      } catch(e) {
        alert("容量オーバーのため追加できませんでした。");
        echoes.pop();
      }
    });
  </script>

</body>
</html>
