<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gender Reveal App</title>
  <style>
    /* 全体のスタイル */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ea 0%, #e8f4fe 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    h1 {
      font-size: 1.6rem;
      color: #444;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #777;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* 性別を設定する設定エリア（発表時には隠すことも可能） */
    /*.setup-area {
      margin-bottom: 1.5rem;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 12px;
    }

    select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
    }
   */
    /* 発表ボタン */
    .reveal-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff819c, #64b5f6);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .reveal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    /* 演出・結果表示エリア */
    .result-area {
      margin-top: 2rem;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* カウントダウン表示 */
    .countdown {
      font-size: 3rem;
      font-weight: bold;
      color: #555;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* 結果カード */
    .result-box {
      display: none;
      width: 100%;
      padding: 1.5rem 1rem;
      border-radius: 16px;
      color: white;
      animation: popIn 0.5s ease-out forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    .boy {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .girl {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    }

    .result-title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .result-gender {
      font-size: 2.5rem;
      font-weight: bold;
    }

    .emoji {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Gender Reveal 👶✨</h1>
    <p class="subtitle">赤ちゃんの性別はどっち...？</p>

    <!-- 事前に性別を設定するエリア -->
    <div class="setup-area">
      <select id="genderSelect">
        <option value="">発表する性別を選んでください</option>
        <option value="boy">👦 男の子 (Boy)</option>
        <option value="girl">👧 女の子 (Girl)</option>
        <option value="random">🎲 ランダム（お楽しみ）</option>
      </select>
    </div>

    <button class="reveal-btn" onclick="startReveal()">オープン！ 🎁</button>

    <!-- 結果・ドラムロール演出表示部 -->
    <div class="result-area">
      <div id="countdown" class="countdown" style="display: none;"></div>
      
      <div id="resultBox" class="result-box">
        <div id="resultEmoji" class="emoji"></div>
        <div class="result-title">Baby is a...</div>
        <div id="resultGender" class="result-gender"></div>
      </div>
    </div>
  </div>

  <script>
    function startReveal() {
      const select = document.getElementById('genderSelect');
      let selectedValue = select.value;

      if (!selectedValue) {
        alert('先に性別を選択してください！');
        return;
      }

      // ランダムが選ばれた場合は五分五分で決定
      if (selectedValue === 'random') {
        selectedValue = Math.random() < 0.5 ? 'boy' : 'girl';
      }

      const countdownEl = document.getElementById('countdown');
      const resultBox = document.getElementById('resultBox');
      const resultEmoji = document.getElementById('resultEmoji');
      const resultGender = document.getElementById('resultGender');

      // リセット
      resultBox.style.display = 'none';
      resultBox.className = 'result-box';
      countdownEl.style.display = 'block';

      // 3秒カウントダウンの演出
      let count = 3;
      countdownEl.textContent = 'ドキドキ...';

      const timer = setInterval(() => {
        if (count > 0) {
          countdownEl.textContent = count;
          count--;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';

          // 結果を表示
          if (selectedValue === 'boy') {
            resultBox.classList.add('boy');
            resultEmoji.textContent = '👦 💙';
            resultGender.textContent = 'BOY !';
          } else {
            resultBox.classList.add('girl');
            resultEmoji.textContent = '👧 💗';
            resultGender.textContent = 'GIRL !';
          }

          resultBox.style.display = 'block';
        }
      }, 800);
    }
  </script>

</body>
</html>
