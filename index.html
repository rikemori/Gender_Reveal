<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>性別発表＆カウントダウンアプリ - 改良版</title>
    <!-- Google Fonts & Font Awesome for icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-bg: #fffbf0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-pink: #ff8fa3;
            --accent-blue: #a2d2ff;
            --text-color: #5c5470;
            --shadow-color: rgba(140, 120, 150, 0.15);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* テキスト選択を無効化してアプリ風に */
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* 長押しメニューを無効化 */
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #f0efef 50%, #e8f4f8 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 80px; /* 下部に余白 */
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- ヘッダー・Dev Modeスイッチ --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #7b68ee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Dev Mode トグルスイッチ */
        .dev-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #888;
            background: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #7b68ee; }
        input:checked + .slider:before { transform: translateX(18px); }

        /* --- カード汎用 --- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 24px 20px;
            box-shadow: 0 8px 24px var(--shadow-color);
            border: 2px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* --- カウントダウンセクション --- */
        .countdown-title {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .target-date {
            font-size: 1.1rem;
            color: #555;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .timer-box {
            background: #ffffff;
            padding: 10px 4px;
            border-radius: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
        }

        .timer-val {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff6b8b;
            line-height: 1.2;
        }

        .timer-unit {
            font-size: 0.7rem;
            color: #aaa;
            font-weight: 700;
            margin-top: 2px;
        }

        /* --- 性別発表カード --- */
        .reveal-card {
            position: relative;
            overflow: hidden;
        }

        .reveal-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.4);
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .reveal-btn:active { transform: scale(0.96); }

        .result-box {
            display: none;
            animation: fadeInScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .gender-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ff3366;
            margin-bottom: 10px;
        }

        .gender-message {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #666;
        }

        /* --- エコー写真ギャラリー・スライダー --- */
        .echo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .echo-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .echo-count {
            font-size: 0.8rem;
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
            color: #777;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            background: #000;
            aspect-ratio: 4 / 3; /* アスペクト比固定 */
        }

        .slide-container {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: #fff;
            padding: 12px 15px 8px;
            font-size: 0.85rem;
            text-align: left;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 5;
        }

        .nav-btn.prev { left: 10px; }
        .nav-btn.next { right: 10px; }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.2s;
        }

        .dot.active {
            background: #ff8fa3;
            width: 20px;
            border-radius: 10px;
        }

        .no-image-box {
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        /* --- 開発者モード用パネル --- */
        .dev-panel {
            display: none; /* 初期は非表示 */
            background: #f9f9f9;
            border: 2px dashed #7b68ee;
            border-radius: var(--radius);
            padding: 20px;
            margin-top: -10px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dev-panel-title {
            font-size: 1rem;
            font-weight: 800;
            color: #7b68ee;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* アップロードエリア */
        .upload-area {
            border: 2px dashed #e0e0e0;
            background: #fff;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            margin-bottom: 15px;
        }

        .upload-area:hover, .upload-area.dragging {
            border-color: #7b68ee;
            background: #f5f3ff;
        }

        .upload-icon {
            font-size: 2rem;
            color: #ccc;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 0.9rem;
            color: #666;
            font-weight: 700;
        }

        .upload-subtext {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }

        #fileInput { display: none; }

        /* プレビューエリア */
        .preview-container {
            display: none;
            margin-top: 15px;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #eee;
            text-align: left;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        .preview-img-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .memo-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            margin-bottom: 10px;
            outline: none;
        }
        
        .memo-input:focus { border-color: #7b68ee; }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add {
            background-color: #7b68ee;
            color: white;
        }

        .btn-add:active { background-color: #6a5acd; }

        .btn-cancel {
            background-color: #eee;
            color: #666;
        }
        
        .btn-cancel:active { background-color: #e0e0e0; }

        /* データリセットボタン */
        .reset-data-wrapper {
            margin-top: 30px;
            text-align: center;
        }
        
        .btn-reset {
            background: none;
            border: none;
            color: #ccc;
            font-size: 0.75rem;
            text-decoration: underline;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <header>
            <div class="header-title">
                <i class="fa-solid fa-baby-carriage"></i> 性別発表アプリ
            </div>
            <!-- 開発者モードスイッチ -->
            <div class="dev-switch-wrapper">
                <span>Dev Mode</span>
                <label class="switch">
                    <input type="checkbox" id="devModeToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <!-- [NEW] 開発者モードパネル -->
        <div class="dev-panel" id="devPanel">
            <div class="dev-panel-title">
                <i class="fa-solid fa-code"></i> 次回のエコー写真を追加
            </div>
            
            <!-- アップロードエリア -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*">
                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                <div class="upload-text">タップして写真を選択</div>
                <div class="upload-subtext">またはカメラを起動</div>
            </div>

            <!-- プレビューとメモ入力 -->
            <div class="preview-container" id="previewContainer">
                <div class="preview-header">
                    <span>追加のプレビュー</span>
                    <span id="fileSize"></span>
                </div>
                <div class="preview-img-wrapper">
                    <img src="" id="previewImg" alt="プレビュー">
                </div>
                <input type="text" id="memoInput" class="memo-input" placeholder="メモ（例：12週目の検診）">
                <div class="btn-group">
                    <button class="btn btn-cancel" id="cancelBtn">キャンセル</button>
                    <button class="btn btn-add" id="addBtn">アルバムに追加</button>
                </div>
            </div>
        </div>

        <!-- カウントダウンカード -->
        <div class="card">
            <div class="countdown-title">出産予定日までのカウントダウン</div>
            <div class="target-date">2026年12月18日</div>
            <div class="timer-grid">
                <div class="timer-box">
                    <div class="timer-val" id="days">--</div>
                    <div class="timer-unit">日</div>
                </div>
                <div class="timer-box">
                    <div class="timer-val" id="hours">--</div>
                    <div class="timer-unit">時間</div>
                </div>
                <div class="timer-box">
                    <div class="timer-val" id="minutes">--</div>
                    <div class="timer-unit">分</div>
                </div>
                <div class="timer-box">
                    <div class="timer-val" id="seconds">--</div>
                    <div class="timer-unit">秒</div>
                </div>
            </div>
        </div>

        <!-- 性別発表カード -->
        <div class="card reveal-card">
            <button class="reveal-btn" id="revealBtn">
                <i class="fa-solid fa-gift"></i> 性別を知る 🎁
            </button>
            <div class="result-box" id="resultBox">
                <div class="gender-title">🎀 女の子 🎀</div>
                <div class="gender-message">元気な女の子が生まれてくる予定です！<br>みんなで会える日を楽しみに待っています✨</div>
            </div>
        </div>

        <!-- エコー写真スライダー -->
        <div class="card">
            <div class="echo-header">
                <div class="echo-title">
                    <i class="fa-solid fa-images"></i> エコー写真アルバム
                </div>
                <div class="echo-count" id="echoCount">0 枚</div>
            </div>

            <div class="slider-wrapper">
                <div class="slide-container" id="slideContainer">
                    <!-- JSで動的生成 -->
                </div>
                <button class="nav-btn prev" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="nav-btn next" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="dots-container" id="dotsContainer"></div>
        </div>
        
        <div class="reset-data-wrapper">
            <button class="btn-reset" id="resetDataBtn">アプリのデータを初期化</button>
        </div>
    </div>

    <script>
        // 設定
        const DEV_PASSWORD = "baby1218";
        const TARGET_DATE_STR = "2026-12-18T00:00:00";
        
        // ローカルストレージ用のキー
        const STORAGE_KEY_ECHOES = "baby_app_echo_list";

        // 初期画像リスト (ダミー)
        const initialEchoes = [
            { id: 1, url: "https://via.placeholder.com/400x300/1a1a1a/ffffff?text=Echo+Photo+1", memo: "初めてのエコー写真 (6週)" },
            { id: 2, url: "https://via.placeholder.com/400x300/333333/ffffff?text=Echo+Photo+2", memo: "元気に動いてた (10週)" }
        ];

        // 状態管理
        let echoes = JSON.parse(localStorage.getItem(STORAGE_KEY_ECHOES)) || initialEchoes;
        let isDevMode = false;
        let currentSlide = 0;
        let tempImageData = null; // アップロード待ちの画像データ


        // --- 初期化処理 ---
        window.addEventListener('DOMContentLoaded', () => {
            initSlider();
            updateCountdown();
            setInterval(updateCountdown, 1000);
            
            // イベントリスナー登録
            document.getElementById('revealBtn').addEventListener('click', revealGender);
            document.getElementById('devModeToggle').addEventListener('change', toggleDevMode);
            document.getElementById('prevBtn').addEventListener('click', () => changeSlide(-1));
            document.getElementById('nextBtn').addEventListener('click', () => changeSlide(1));
            document.getElementById('uploadArea').addEventListener('click', () => document.getElementById('fileInput').click());
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('addBtn').addEventListener('click', addEchoPhoto);
            document.getElementById('cancelBtn').addEventListener('click', resetUploadArea);
            document.getElementById('resetDataBtn').addEventListener('click', resetAllData);
            
            // スライダーのスワイプ対応
            initSwipe();
        });


        // --- カウントダウン機能 ---
        function updateCountdown() {
            const target = new Date(TARGET_DATE_STR).getTime();
            const now = new Date().getTime();
            const diff = target - now;

            if (diff <= 0) {
                // 予定日を過ぎた場合
                document.querySelector('.timer-grid').innerHTML = "<div style='grid-column:1/-1; color:#ff6b8b; font-weight:bold;'>Happy Baby Day! 👶✨</div>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(d).padStart(2, '0');
            document.getElementById('hours').textContent = String(h).padStart(2, '0');
            document.getElementById('minutes').textContent = String(m).padStart(2, '0');
            document.getElementById('seconds').textContent = String(s).padStart(2, '0');
        }


        // --- 性別発表演出 ---
        function revealGender() {
            const btn = document.getElementById('revealBtn');
            const result = document.getElementById('resultBox');
            
            btn.style.display = 'none';
            result.style.display = 'block';

            // 紙吹雪エフェクト
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff8fa3', '#ffccd5', '#ffffff', '#a2d2ff']
            });
        }


        // --- 開発者モード ---
        function toggleDevMode(e) {
            const toggle = e.target;
            const panel = document.getElementById('devPanel');

            if (toggle.checked) {
                // パスワード確認
                const pass = prompt("開発者パスワードを入力してください");
                if (pass === DEV_PASSWORD) {
                    isDevMode = true;
                    panel.style.display = 'block';
                } else {
                    alert("パスワードが違います");
                    toggle.checked = false; // スイッチを戻す
                    isDevMode = false;
                    panel.style.display = 'none';
                }
            } else {
                isDevMode = false;
                panel.style.display = 'none';
                resetUploadArea();
            }
        }


        // --- エコー写真追加機能 (開発者モード) ---
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file || !file.type.match('image.*')) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const src = evt.target.result;
                
                // 画像を圧縮する
                compressImage(src, 800, (compressedDataUrl) => {
                    tempImageData = compressedDataUrl;
                    
                    // プレビュー表示
                    document.getElementById('previewImg').src = compressedDataUrl;
                    document.getElementById('fileSize').textContent = formatBytes(file.size);
                    document.getElementById('uploadArea').style.display = 'none';
                    document.getElementById('previewContainer').style.display = 'block';
                });
            };
            reader.readAsDataURL(file);
        }

        // 画像のアルバムへの追加
        function addEchoPhoto() {
            if (!tempImageData) return;

            const memoInput = document.getElementById('memoInput');
            const memo = memoInput.value.trim();

            const newPhoto = {
                id: Date.now(), // ユニークID
                url: tempImageData,
                memo: memo || `${new Date().toLocaleDateString('ja-JP')} 撮影`
            };

            // 配列に追加
            echoes.push(newPhoto);
            
            // ローカルストレージに保存
            saveToStorage();
            
            // UIを更新
            resetUploadArea();
            initSlider(); // スライダー再生成
            goToSlide(echoes.length - 1); // 追加した画像へ移動
            
            alert("写真をアルバムに追加しました！");
        }

        function resetUploadArea() {
            tempImageData = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('memoInput').value = '';
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';
        }

        // --- データ保存と初期化 ---
        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_ECHOES, JSON.stringify(echoes));
            } catch (e) {
                console.error("Storage error:", e);
                alert("保存容量を超えたため、これ以上写真は追加できません。");
                echoes.pop(); // 最後に追加したのを削除
            }
        }
        
        function resetAllData() {
            if(confirm("アップロードした写真を含む、アプリのすべてのデータを初期化しますか？")) {
                localStorage.removeItem(STORAGE_KEY_ECHOES);
                location.reload();
            }
        }


        // --- エコー写真スライダー (表示系) ---
        const container = document.getElementById('slideContainer');
        const dots = document.getElementById('dotsContainer');
        const countDisplay = document.getElementById('echoCount');

        function initSlider() {
            container.innerHTML = '';
            dots.innerHTML = '';
            countDisplay.textContent = `${echoes.length} 枚`;

            if (echoes.length === 0) {
                container.innerHTML = '<div class="slide"><div class="no-image-box"><i class="fa-solid fa-image" style="font-size:2rem; margin-bottom:8px;"></i><br>写真は登録されていません</div></div>';
                document.getElementById('prevBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                return;
            }
            
            document.getElementById('prevBtn').style.display = 'flex';
            document.getElementById('nextBtn').style.display = 'flex';

            echoes.forEach((echo, index) => {
                // スライド作成
                const slide = document.createElement('div');
                slide.className = 'slide';
                
                const img = document.createElement('img');
                // ローディングを考慮
                img.src = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox%3D'0 0 400 300'%2F%3E"; // placeholder
                img.dataset.src = echo.url; 
                img.className = "lazyload"; // 簡易 Lazy Load (実装は省略、すぐ読み込む)
                img.alt = `エコー写真 ${index + 1}`;
                
                slide.appendChild(img);
                
                if (echo.memo) {
                    const caption = document.createElement('div');
                    caption.className = 'slide-caption';
                    caption.textContent = echo.memo;
                    slide.appendChild(caption);
                }
                
                container.appendChild(slide);

                // ドット作成
                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.addEventListener('click', () => goToSlide(index));
                dots.appendChild(dot);
            });
            
            //Lazy load代わりの即時読み込み
            container.querySelectorAll('img.lazyload').forEach(img => {
                img.src = img.dataset.src;
            });

            currentSlide = 0;
            updateSliderPosition();
        }

        function changeSlide(direction) {
            goToSlide(currentSlide + direction);
        }

        function goToSlide(index) {
            const len = echoes.length;
            if (len === 0) return;
            
            // ループさせる
            currentSlide = (index + len) % len;
            updateSliderPosition();
        }

        function updateSliderPosition() {
            if (echoes.length === 0) return;
            
            // 移動
            container.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // ドットの更新
            const allDots = dots.querySelectorAll('.dot');
            allDots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }
        
        // --- ユーティリティ ---
        
        // 画像圧縮 (Canvasを使用)
        function compressImage(base64, maxW, callback) {
            const img = new Image();
            img.src = base64;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                let width = img.width;
                let height = img.height;
                
                if (width > maxW) {
                    height = Math.round((height * maxW) / width);
                    width = maxW;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                ctx.drawImage(img, 0, 0, width, height);
                
                // JPEG、品質0.7で書き出し
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // スマホスワイプ対応
        function initSwipe() {
            let touchStartX = 0;
            let touchEndX = 0;
            
            const slider = document.querySelector('.slider-wrapper');
            
            slider.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});
            
            slider.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});
            
            function handleSwipe() {
                if (echoes.length <= 1) return;
                const swipeDistance = touchStartX - touchEndX;
                const threshold = 50; // スワイプと判定する最低距離
                
                if (swipeDistance > threshold) {
                    // 左スワイプ -> 次へ
                    changeSlide(1);
                } else if (swipeDistance < -threshold) {
                    // 右スワイプ -> 前へ
                    changeSlide(-1);
                }
            }
        }

    </script>
</body>
</html>
