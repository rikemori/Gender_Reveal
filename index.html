<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gender Reveal App</title>
  <!-- ★紙吹雪用ライブラリ（canvas-confetti）の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* 全体のスタイル */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ea 0%, #e8f4fe 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem 1.8rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    h1 {
      font-size: 1.6rem;
      color: #444;
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: #777;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    /* 予定日カウントダウンエリア */
    .due-date-box {
      background: #ffffff;
      border: 2px dashed #ff9a9e;
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .due-date-title {
      font-size: 0.85rem;
      color: #888;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }

    .due-date-text {
      font-size: 0.95rem;
      color: #ff6b81;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .timer-display {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .timer-unit {
      background: #fff0f3;
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 45px;
    }

    .timer-num {
      font-size: 1.2rem;
      font-weight: bold;
      color: #d81b60;
      line-height: 1.1;
    }

    .timer-label {
      font-size: 0.65rem;
      color: #888;
    }

    /* 発表ボタン */
    .reveal-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff819c, #64b5f6);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .reveal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    /* 演出・結果表示エリア */
    .result-area {
      margin-top: 1.5rem;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ドラムロールカウントダウン表示 */
    .countdown {
      font-size: 3rem;
      font-weight: bold;
      color: #555;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* 結果カード */
    .result-box {
      display: none;
      width: 100%;
      padding: 1.5rem 1rem;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      animation: popIn 0.5s ease-out forwards;
      box-sizing: border-box;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    .result-title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .result-gender {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .emoji {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
    }

    .custom-image {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Gender Reveal 👶✨</h1>
    <p class="subtitle">赤ちゃんの性別はどっち...？</p>

    <!-- 出産予定日までのカウントダウン枠 -->
    <div class="due-date-box">
      <div class="due-date-title">BABY DUE DATE 🍼</div>
      <div class="due-date-text">2026年12月18日まで</div>
      <div class="timer-display">
        <div class="timer-unit"><div id="days" class="timer-num">00</div><div class="timer-label">日</div></div>
        <div class="timer-unit"><div id="hours" class="timer-num">00</div><div class="timer-label">時間</div></div>
        <div class="timer-unit"><div id="minutes" class="timer-num">00</div><div class="timer-label">分</div></div>
        <div class="timer-unit"><div id="seconds" class="timer-num">00</div><div class="timer-label">秒</div></div>
      </div>
    </div>

    <!-- 発表ボタン -->
    <button id="revealBtn" class="reveal-btn" onclick="startReveal()">オープン！ 🎁</button>

    <!-- 結果表示エリア -->
    <div class="result-area">
      <div id="countdown" class="countdown" style="display: none;"></div>
      
      <div id="resultBox" class="result-box">
        <div class="emoji">👧 💗</div>
        <div class="result-title">Baby is a...</div>
        <div class="result-gender">GIRL !</div>
        
        <!-- 差し込み画像 -->
        <img id="revealImage" class="custom-image" src="baby_girl10_heart.png" alt="女の子の画像">
      </div>
    </div>
  </div>

  <script>
    // 1. 出産予定日のリアルタイムカウントダウン機能
    const targetDate = new Date('2026-12-18T00:00:00').getTime();

    function updateDueDateTimer() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.querySelector('.due-date-box').innerHTML = "<div class='due-date-text'>出産予定日を迎えました！👶✨</div>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateDueDateTimer, 1000);
    updateDueDateTimer();

    // 2. 紙吹雪を飛ばす関数
    function launchConfetti() {
      const count = 200;
      const defaults = {
        origin: { y: 0.7 }
      };

      function fire(particleRatio, opts) {
        confetti({
          ...defaults,
          ...opts,
          particleCount: Math.floor(count * particleRatio)
        });
      }

      // 女の子向けにピンク・ゴールド・ホワイト系の紙吹雪を発射
      fire(0.25, {
        spread: 26,
        startVelocity: 55,
        colors: ['#ff9a9e', '#fecfef', '#ffffff']
      });
      fire(0.2, {
        spread: 60,
        colors: ['#ff819c', '#ffd1dc', '#ffd700']
      });
      fire(0.35, {
        spread: 100,
        decay: 0.91,
        scalar: 0.8
      });
      fire(0.1, {
        spread: 120,
        startVelocity: 25,
        decay: 0.92,
        colors: ['#ff819c', '#ffffff']
      });
      fire(0.1, {
        spread: 120,
        startVelocity: 45,
      });
    }

    // 3. 性別発表ボタンの動作
    function startReveal() {
      const revealBtn = document.getElementById('revealBtn');
      const countdownEl = document.getElementById('countdown');
      const resultBox = document.getElementById('resultBox');
      const revealImage = document.getElementById('revealImage');

      revealBtn.style.display = 'none';

      countdownEl.style.display = 'block';
      let count = 3;
      countdownEl.textContent = 'ドキドキ...';

      const timer = setInterval(() => {
        if (count > 0) {
          countdownEl.textContent = count;
          count--;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';

          resultBox.style.display = 'block';
          revealImage.style.display = 'block';

          // ★結果表示と同時に紙吹雪を発射！★
          launchConfetti();
        }
      }, 800);
    }
  </script>

</body>
</html>
